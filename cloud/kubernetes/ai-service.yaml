apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: crypto-mining
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: crypto-mining-ai:latest
          ports:
            - containerPort: 5000
          env:
            - name: AI_PORT
              value: "5000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: crypto-mining
spec:
  selector:
    app: ai-service
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
