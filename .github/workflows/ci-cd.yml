name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: crypto-mining-backend
  FRONTEND_IMAGE: crypto-mining-frontend
  AI_IMAGE: crypto-mining-ai

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build Backend
        run: mvn clean package -DskipTests -B
      - name: Run Tests
        run: mvn test -B

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm install
      - name: Build Frontend
        run: npm run build

  ai-test:
    name: AI Service Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Lint Check
        run: python -m py_compile app.py

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, ai-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [backend, frontend, ai]
    steps:
      - uses: actions/checkout@v4
      
      # FIX: This step converts "SimranJotK/mining_platform" to lowercase values safely
      - name: Set lowercase repository name env
        run: |
          echo "LOWER_REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service == 'ai' && 'ai' || matrix.service }}
          push: false
          # FIX: Replaced github.repository with our new LOWER_REPO variable
          tags: ${{ env.REGISTRY }}/${{ env.LOWER_REPO }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4

      # 1. Setup Java and enable automatic caching of the ~/.m2 folder
      - name: Set up JDK 17 & Cache Maven
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 2. Pre-download dependencies locally so Trivy doesn't fetch them remotely
      - name: Pre-resolve Maven Dependencies
        run: |
          cd backend
          mvn dependency:resolve -B

      # 3. Run Trivy using the cached local packages
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH

