# Local desktop profile — H2 with MySQL compatibility (use docker-compose for real MySQL)
server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./data/crypto_mining;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  ai:
    service-url: http://localhost:5001
